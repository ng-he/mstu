[package]
name = "mstu-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.52.3", features = ["full"] }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "time", "env-filter"] }
tracing-appender = "0.2"

time = { version = "0.3", features = ["local-offset", "macros"] }
libloading = "0.8"
nanoid = "0.4"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

mstu-sdk = { path = "../mstu-sdk" }