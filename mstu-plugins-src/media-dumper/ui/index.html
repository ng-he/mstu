<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Media dumper</title>
    <link rel="stylesheet" href="./_sdk/mstu.css" />
  </head>
  <body>
    <div class="label">Output folder</div>

    <div class="field">
      <input id="dir" placeholder="Working directory" />
      <button id="browse" title="Choose a folder">…</button>
    </div>

    <div class="path" id="file">no file open</div>

    <div class="status">
      <span class="dot" id="dot"></span>
      <span class="count" id="size">0 B</span>
      <button class="action" id="finish" disabled>Finish</button>
    </div>

    <script type="module">
      import { connect, humanSize } from './_sdk/mstu.js'

      const plugin = await connect({ width: 300, height: 220 })
      const el = plugin.el

      /// The dot lights while the byte count is still moving.
      let written = 0

      el('dir').addEventListener('change', (event) =>
        plugin.set('output_path', event.target.value)
      )

      el('browse').addEventListener('click', () =>
        plugin.pick('output_path', { kind: 'directory' })
      )

      el('finish').addEventListener('click', () => plugin.invoke('write.finish'))

      plugin.onSettings((settings) => {
        el('dir').value = settings.output_path ?? ''
      })

      plugin.onLive(({ file, bytes }) => {
        const open = Boolean(file)

        el('file').textContent = open ? file : 'no file open'
        el('size').textContent = humanSize(bytes)
        el('dot').classList.toggle('on', open && bytes !== written)
        el('finish').disabled = !open

        written = bytes ?? 0
      })

      plugin.onState(({ running }) => {
        if (!running) el('dot').classList.remove('on')
      })
    </script>
  </body>
</html>
