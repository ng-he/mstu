<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Preview</title>
    <link rel="stylesheet" href="./_sdk/mstu.css" />
    <style>
      :host {
        display: flex;
        flex-direction: column;
        padding: 0;
        background: #000;
      }

      video {
        flex: 1;
        min-height: 0;
        width: 100%;
        object-fit: contain;
        background: #000;
      }

      .note {
        padding: 6px 10px;
        border-top: 1px solid var(--mstu-border);
        background: var(--mstu-bg);
        color: var(--mstu-text-faint);
        font-size: 10px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .note.error {
        color: var(--mstu-red);
      }
    </style>
  </head>
  <body>
    <video id="video" muted playsinline preload="auto"></video>
    <div class="note" id="note">follows the node's position</div>

    <script type="module" src="./preview.js"></script>
  </body>
</html>
