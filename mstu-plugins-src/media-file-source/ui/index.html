<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Media file source</title>
    <link rel="stylesheet" href="./_sdk/mstu.css" />
    <style>
      .transport {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 9px;
      }

      .transport select {
        padding: 3px 5px;
        border: 1px solid var(--border);
        border-radius: 4px;
        background: var(--bg-input);
        color: var(--text);
        font: inherit;
        font-size: 11px;
      }

      .toggle {
        display: flex;
        align-items: center;
        gap: 5px;
        color: var(--text-dim);
        cursor: pointer;
        user-select: none;
      }

      /* Seeking is only possible when the source can index by time. */
      .scrub {
        position: relative;
        height: 4px;
        margin-top: 11px;
        border-radius: 2px;
        background: #1a1a1a;
        cursor: pointer;
      }

      .scrub[aria-disabled='true'] {
        cursor: default;
        opacity: 0.5;
      }

      .scrub .played {
        position: absolute;
        inset: 0 auto 0 0;
        width: 0;
        border-radius: 2px;
        background: var(--accent);
      }

      .scrub .head {
        position: absolute;
        top: 50%;
        left: 0;
        width: 9px;
        height: 9px;
        margin: -4.5px 0 0 -4.5px;
        border-radius: 50%;
        background: var(--accent);
      }

      .clock {
        margin-top: 7px;
        font-family: 'IBM Plex Mono', ui-monospace, monospace;
        font-size: 10px;
        color: var(--text-dim);
      }

      #watch.on {
        border-color: var(--accent);
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <div class="label">Source file</div>

    <div class="field">
      <input id="path" placeholder="No file selected" />
      <button id="browse" title="Choose a file">…</button>
    </div>

    <div class="meta">
      <span class="chip" id="codec">—</span>
      <span class="dim" id="file">no file open</span>
    </div>

    <div class="scrub" id="scrub" aria-disabled="true">
      <span class="played" id="played"></span>
      <span class="head" id="head"></span>
    </div>

    <div class="clock"><span id="at">0:00</span> / <span id="total">--:--</span></div>

    <div class="transport">
      <select id="rate" title="Playback speed">
        <option value="1">1x</option>
        <option value="0.5">0.5x</option>
        <option value="2">2x</option>
        <option value="4">4x</option>
        <option value="0">as fast as possible</option>
      </select>

      <label class="toggle"><input type="checkbox" id="loop" /> loop</label>

      <button class="action" id="watch" disabled>Preview</button>
    </div>

    <div class="status">
      <span class="dot" id="dot"></span>
      <span id="state">idle</span>
      <span class="count" id="samples">0</span>
    </div>

    <script type="module" src="./index.js"></script>
  </body>
</html>
