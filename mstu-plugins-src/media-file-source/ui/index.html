<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Media file source</title>
    <link rel="stylesheet" href="./_sdk/mstu.css" />
  </head>
  <body>
    <div class="label">Source file</div>

    <div class="field">
      <input id="path" placeholder="No file selected" />
      <button id="browse" title="Choose a file">…</button>
    </div>

    <div class="meta">
      <span class="chip" id="codec">—</span>
      <span class="dim" id="file">no file open</span>
    </div>

    <div class="status">
      <span class="dot" id="dot"></span>
      <span id="state">idle</span>
      <span class="count" id="samples">0</span>
    </div>

    <script type="module">
      import { connect } from './_sdk/mstu.js'

      const plugin = await connect({ width: 300, height: 210 })
      const el = plugin.el

      let ended = false

      const showState = (text, lit) => {
        el('state').textContent = text
        el('dot').classList.toggle('on', lit)
      }

      el('path').addEventListener('change', (event) => plugin.set('path', event.target.value))
      el('browse').addEventListener('click', () => plugin.pick('path', { kind: 'file' }))

      plugin.onSettings((settings) => {
        el('path').value = settings.path ?? ''
      })

      plugin.onEvent('file.changed', ({ file_name, codec }) => {
        el('file').textContent = file_name.split('/').pop()
        el('codec').textContent = codec
      })

      plugin.onEvent('file.ended', () => showState('end of file', false))

      plugin.onLive((live) => {
        el('samples').textContent = (live.samples ?? 0).toLocaleString()

        ended = Boolean(live.ended)
        if (ended) showState('end of file', false)
      })

      plugin.onState(({ running }) => {
        if (!ended) showState(running ? 'reading' : 'idle', running)
      })
    </script>
  </body>
</html>
